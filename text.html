<!DOCTYPE html>
<html>
    <head>
        <title>text Webpage</title>
    </head>
    <style>
    .description {
    font-family: Arial;
    font-size: 25px;
    font-weight: bold;
    font-style: italic;
    margin-top: 0px;
    margin-left: 12px;
    margin-bottom: 9px;
    color: rgb(0, 0, 0);
    width: 400px;
    line-height: 28px;
}
.views {
    font-family:luciadaHeights;
    font-size: 14px;
    color: rgb(58, 57, 57);
    margin-top: 0px;
    margin-left: 13px;
    margin-bottom: 10px;
    font-weight: 100;
}
.name {
    font-family: Monaco;
    font-size: 14px;
    color: rgb(92, 90, 90);
    margin-top: 0px;
    margin-left: 13px;
    font-weight: 56px;
}

.paragraph {
    font-family: Lucida Handwriting;
    font-size: 14px;
    color: rgb(97, 90, 90);
    margin-top: 0px;
    margin-left: 13px;
    margin-right: 400px;
    line-height: 20px;
    font-weight: 100;
    width: 300px;
    margin-bottom: 50px;
}
.content {

    background-color: rgb(249, 5, 5);
    color: white;
    border: none;
    line-height: 56px;
    font-style: Arial;
    text-align: center;
 
}
.dot {
    
    font-style: italic;
    font-weight: bold;
    
}

.dot:hover{
text-decoration: underline;
cursor: pointer;
}
.logo {
    margin-top: 70px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
}
.logoses {
    cursor: pointer;
}


</style>

<body>
    <img class="logo" src="youtube logo.jpg" alt="youtube image" height="40px" width="50px">

<p class="description">
    Talking Tech and AI with Google CEO Sundar Pichai!
</p>
<p class="views">
    1.4M views &#x2027 2 weeks ago
</p>
<p class="name">
    Shyam Sundar &#x2713;
</p>

<p class="paragraph">
    Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's CEO. Shoutout to Sundar!
</p>

<img class="logoses" src="apple.jpg" alt="apple image" height="30px" width="40px">

<p class="content">
    Shop early for the best selection of holidays favourites &#x2e;<span class="dot">Shop Now &#x3e;</span>
</p>
</body>
</html>
